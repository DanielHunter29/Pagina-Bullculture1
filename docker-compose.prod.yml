# ==========================================================================
# BULLCULTURE — Orquestación de PRODUCCIÓN (backend + PostgreSQL + backups).
# El frontend (Next.js) se despliega en Vercel.
# Requiere un .env con DJANGO_SETTINGS_MODULE=config.settings.prod y secretos.
# La terminación TLS/HTTPS la hace el proxy/plataforma delante de este stack.
# ==========================================================================

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Caché compartida (throttling de la API entre workers). Sin persistencia:
  # si se reinicia solo se pierden contadores de rate limiting.
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"  # detrás de un proxy TLS (nginx/traefik/plataforma)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Copias de seguridad automáticas diarias de la base de datos.
  db_backup:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./scripts:/scripts:ro
      - db_backups:/backups
    entrypoint: >
      sh -c "while true; do sh /scripts/backup_db.sh || echo 'backup fallo'; sleep 86400; done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  db_backups:
