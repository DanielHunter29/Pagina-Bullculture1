# ==========================================================================
# BULLCULTURE — Orquestación de PRODUCCIÓN (backend + PostgreSQL + backups).
# El frontend (Next.js) se despliega en Vercel.
# Requiere un .env con DJANGO_SETTINGS_MODULE=config.settings.prod y secretos.
# La terminación TLS/HTTPS la hace el proxy/plataforma delante de este stack.
# ==========================================================================

# Imagen y entorno comunes a los servicios de Django (backend, migrate, scheduler).
x-django: &django
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: bullculture-backend:latest
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Caché compartida (throttling de la API entre workers). Sin persistencia:
  # si se reinicia solo se pierden contadores de rate limiting.
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Migraciones como paso de release (una vez por despliegue, no en cada
  # arranque de cada réplica). backend y scheduler esperan a que termine bien.
  migrate:
    <<: *django
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *django
    restart: always
    # Usa el CMD de la imagen (gunicorn). Workers: GUNICORN_CMD_ARGS en .env
    # (por defecto 3; recomendado 2 × núcleos del VPS + 1).
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"  # detrás de un proxy TLS (nginx/traefik/plataforma)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Tareas periódicas (cada 15 min): reintento de correos de confirmación
  # fallidos y expiración de pedidos pendientes abandonados.
  scheduler:
    <<: *django
    restart: always
    command: >
      sh -c "while true; do python manage.py run_maintenance || echo 'mantenimiento fallo'; sleep 900; done"
    healthcheck:
      disable: true  # no sirve HTTP
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Copias de seguridad automáticas diarias de la base de datos.
  db_backup:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./scripts:/scripts:ro
      - db_backups:/backups
    entrypoint: >
      sh -c "while true; do sh /scripts/backup_db.sh || echo 'backup fallo'; sleep 86400; done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  db_backups:
